<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="pi-plugin-chrome" content="v3" />
    <title>PiOpt</title>
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./base.css" />
    <link rel="stylesheet" href="./market.css" />
    <link rel="stylesheet" href="./motion.css" />
    <link rel="stylesheet" href="./gateway.css" />
  </head>
  <body>
    <header class="opt-dragbar">
      <span class="opt-brand"><span class="opt-mark" aria-hidden="true"><i></i><i></i><i></i></span>PiOpt</span>
    </header>

    <nav class="opt-rail" id="optRail" aria-label="PiOpt 导航" data-expanded="false">
      <button type="button" class="rail-toggle" id="railToggle" aria-expanded="false" aria-controls="optRail" title="展开菜单" aria-label="展开菜单">
        <svg class="rail-glyph" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6.2 3.8 10.4 8l-4.2 4.2" />
        </svg>
        <span class="rail-label">展开菜单</span>
      </button>
      <div class="rail-tabs" role="tablist" aria-label="PiOpt 功能">
        <button type="button" role="tab" id="tab-market" data-feature="market" aria-selected="true" aria-controls="view-market" title="插件市场" aria-label="插件市场">
          <svg viewBox="0 0 16 16" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2.6 5.6h10.8l-.75 7.6a1 1 0 0 1-1 .9H4.35a1 1 0 0 1-1-.9z" />
            <path d="M5.9 5.6V4.1a2.1 2.1 0 0 1 4.2 0v1.5" />
          </svg>
          <span class="rail-label">插件市场</span>
        </button>
        <button type="button" role="tab" id="tab-motion" data-feature="motion" aria-selected="false" aria-controls="view-motion" title="动效实验室" aria-label="动效实验室">
          <svg viewBox="0 0 16 16" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M1.6 9.2h2.1l1.2-3.6 1.9 7 1.6-10 1.5 6.6h4.5" />
          </svg>
          <span class="rail-label">动效实验室</span>
        </button>
        <button type="button" role="tab" id="tab-gateway" data-feature="gateway" aria-selected="false" aria-controls="view-gateway" title="AI 网关" aria-label="AI 网关">
          <svg viewBox="0 0 16 16" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="8" cy="8" r="2.1" />
            <path d="M8 1.4v2.2M8 12.4v2.2M1.4 8h2.2M12.4 8h2.2" />
            <path d="M3.4 3.4l1.5 1.5M11.1 11.1l1.5 1.5M12.6 3.4l-1.5 1.5M4.9 11.1l-1.5 1.5" opacity=".55" />
          </svg>
          <span class="rail-label">AI 网关</span>
        </button>
      </div>
    </nav>

    <section id="view-market" class="opt-view" role="tabpanel" aria-labelledby="tab-market">
    <header class="topbar">
      <div class="brand">Pimarket <small id="hostVersion"></small></div>
      <span class="chip" id="catalogChip"><span class="dot"></span><span>catalog</span></span>
      <span class="chip" id="updateChip"></span>
      <div class="spacer"></div>
      <button class="btn" id="btnRefresh"></button>
      <button class="btn primary" id="btnPrepareAll"></button>
    </header>

    <div class="shell">
      <nav class="rail" id="rail" role="tablist" aria-label="Pimarket"></nav>
      <section class="work">
        <div class="toolrow">
          <label class="search">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
              <circle cx="7" cy="7" r="4.6" /><path d="M10.5 10.5 14 14" stroke-linecap="round" />
            </svg>
            <input id="q" type="search" autocomplete="off" spellcheck="false" />
          </label>
        </div>
        <div class="notice" id="notice"></div>
        <div class="scroll" id="scroll"><div class="skeleton"><i></i><i></i><i></i><i></i></div></div>
      </section>
    </div>

    <div class="veil" id="veil" hidden>
      <div class="modal" role="dialog" aria-modal="true" id="modalBox"></div>
    </div>
    </section>

    <section id="view-motion" class="opt-view" role="tabpanel" aria-labelledby="tab-motion" hidden>
    <div class="app-shell">
      <header class="titlebar">
        <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
        <strong>Pi Modify</strong>
        <span class="title-separator" aria-hidden="true"></span>
        <span class="title-section">Motion Lab</span>
        <div class="title-status" id="title-status">准备就绪</div>
      </header>

      <main class="workspace">
        <div class="panels">
          <section class="panel">
            <div class="section-heading">
              <div>
                <h1>动效调校</h1>
                <p id="preset-summary">平衡的响应速度与空间感</p>
              </div>
              <span class="sync-dot" id="sync-dot" data-state="ready" title="设置已实时应用"></span>
            </div>

            <div class="segmented preset-options" role="group" aria-label="动画预设">
              <button type="button" data-preset="agile">敏捷</button>
              <button type="button" data-preset="balanced">平衡</button>
              <button type="button" data-preset="gentle">柔和</button>
              <button type="button" data-preset="reduced">减弱</button>
            </div>

            <div class="range-stack">
              <label class="range-control" for="intensity">
                <span><strong>运动强度</strong><output id="intensity-value">100%</output></span>
                <input id="intensity" type="range" min="50" max="150" step="5" value="100" />
                <span class="range-ends" aria-hidden="true"><small>克制</small><small>清晰</small></span>
              </label>

              <label class="range-control" for="speed">
                <span><strong>响应速度</strong><output id="speed-value">1.00×</output></span>
                <input id="speed" type="range" min="60" max="160" step="5" value="100" />
                <span class="range-ends" aria-hidden="true"><small>舒缓</small><small>迅速</small></span>
              </label>
            </div>
          </section>

          <section class="panel">
            <div>
              <div class="field-label">外观基底</div>
              <div class="segmented mode-options" role="group" aria-label="外观基底">
                <button type="button" data-mode="auto" title="跟随系统外观">自动</button>
                <button type="button" data-mode="light" title="固定浅色基底">浅色</button>
                <button type="button" data-mode="dark" title="固定深色基底">深色</button>
              </div>
            </div>

            <label class="switch-row">
              <span>
                <strong>跟随系统减弱动态</strong>
                <small>系统请求减少运动时自动收敛</small>
              </span>
              <input id="follow-reduced" type="checkbox" checked />
              <span class="switch" aria-hidden="true"><span></span></span>
            </label>

            <div class="metrics" aria-label="当前动画参数">
              <div class="field-label">Motion tokens</div>
              <dl>
                <div><dt>按压</dt><dd id="token-instant">80 ms</dd></div>
                <div><dt>控件</dt><dd id="token-fast">130 ms</dd></div>
                <div><dt>内容</dt><dd id="token-base">190 ms</dd></div>
                <div><dt>弹层</dt><dd id="token-slow">260 ms</dd></div>
                <div><dt>位移</dt><dd id="token-distance">7 px</dd></div>
                <div><dt>缩放</dt><dd id="token-scale">0.985</dd></div>
              </dl>
            </div>
          </section>
        </div>

        <div class="control-actions">
          <button type="button" class="button secondary" id="reset-button">恢复平衡</button>
          <button type="button" class="button quiet" id="stop-button">停止全部动画</button>
        </div>
      </main>

      <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    </div>
    </section>

    <section id="view-gateway" class="opt-view" role="tabpanel" aria-labelledby="tab-gateway" hidden>
    </section>

    <script src="./market.js"></script>
    <script src="./motion.js"></script>
    <script src="./gateway.js"></script>
    <script src="./shell.js"></script>
  </body>
</html>
